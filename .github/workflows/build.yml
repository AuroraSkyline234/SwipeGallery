name: Build iPhone app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPhone without signing
        run: >-
          xcodebuild -project SwipeGallery.xcodeproj -scheme SwipeGallery
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA for AltStore
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/SwipeGallery.app package/Payload/
          cd package
          zip -qr ../SwipeGallery.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SwipeGallery-iPhone
          path: SwipeGallery.ipa
          retention-days: 7
