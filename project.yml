name: SwipeGallery
options:
  bundleIdPrefix: app.swipegallery
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
targets:
  SwipeGallery:
    type: application
    platform: iOS
    sources: [SwipeGallery]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swipegallery.personal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwipeGallery
        INFOPLIST_KEY_CFBundleName: SwipeGallery
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Показываем ваши фото и видео по очереди и удаляем только выбранные вами файлы после подтверждения.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '2'
    scheme: {}
